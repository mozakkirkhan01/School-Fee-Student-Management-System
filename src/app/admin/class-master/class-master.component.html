<main id="main" class="main" *ngIf="action.ResponseReceived">
  <div class="row mb-3">
    <div class="col-sm-8">
      <h1>{{ action.MenuTitle }}</h1>
    </div>
    <div class="col-sm-4 text-end">
      <button pButton label="New Class" icon="pi pi-plus" class="p-button-success"
        *ngIf="action.CanCreate" (click)="openNew()"></button>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <p-toolbar styleClass="mb-3">
        <ng-template pTemplate="left">
          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input pInputText type="text" [(ngModel)]="searchText" placeholder="Search class..." />
          </span>
        </ng-template>
      </p-toolbar>

      <p-table #dt [value]="ClassMasterList | filter:searchText" [loading]="dataLoading" [paginator]="true" [rows]="10"
        [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 70px">S.No</th>
            <th>Order</th>
            <th>Class Name</th>
            <th>Status</th>
            <th *ngIf="action.CanEdit || action.CanDelete" style="width: 130px">Action</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item let-i="rowIndex">
          <tr>
            <td>{{ i + 1 }}</td>
            <td>{{ item.DisplayOrder }}</td>
            <td>{{ item.ClassName }}</td>
            <td>
              <p-tag [value]="item.Status ? 'Active' : 'Inactive'" [severity]="item.Status ? 'success' : 'danger'"></p-tag>
            </td>
            <td *ngIf="action.CanEdit || action.CanDelete">
              <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success p-button-text me-1"
                *ngIf="action.CanEdit" (click)="editClassMaster(item)"></button>
              <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-text"
                *ngIf="action.CanDelete" (click)="deleteClassMaster(item)"></button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="text-center p-4">No classes found.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <p-dialog
    [(visible)]="displayDialog"
    [header]="ClassMaster.ClassId > 0 ? 'Update Class' : 'New Class'"
    [modal]="true"
    [style]="{ width: '450px' }"
    [draggable]="false"
    [resizable]="false"
    (onHide)="hideDialog()">

    <form #formClassMaster="ngForm" class="p-fluid">
      <div class="field mb-3">
        <label>Class Name <span class="text-danger">*</span></label>
        <input pInputText name="ClassName" [(ngModel)]="ClassMaster.ClassName" [required]="true" autofocus placeholder="e.g. Class 1, Nursery, LKG" />
        <small class="p-error" *ngIf="isSubmitted && formClassMaster.controls['ClassName']?.invalid">
          Class Name is required
        </small>
      </div>

      <div class="field mb-3">
        <label>Display Order <span class="text-danger">*</span></label>
        <p-inputNumber name="DisplayOrder" [(ngModel)]="ClassMaster.DisplayOrder" [required]="true" [min]="0" [showButtons]="true"></p-inputNumber>
      </div>

      <div class="field mb-3">
        <label>Status <span class="text-danger">*</span></label>
        <p-dropdown name="Status" [options]="statusOptions" [(ngModel)]="ClassMaster.Status" optionLabel="label" optionValue="value" placeholder="Select Status" [required]="true"></p-dropdown>
      </div>
    </form>

    <ng-template pTemplate="footer">
      <button pButton label="Cancel" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
      <button pButton [label]="ClassMaster.ClassId > 0 ? 'Update' : 'Save'" icon="pi pi-check" (click)="saveClassMaster()"></button>
    </ng-template>
  </p-dialog>
</main>
